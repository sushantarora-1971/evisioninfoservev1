# Evision Infoserve — HTTPS vhost on a real (sub)domain.
#
# The voice agent REQUIRES this. ElevenLabs calls the webhooks from their own
# servers over HTTPS, so http://YOUR_VPS_IP:8080 cannot be used — it must be a
# name with a certificate.
#
# This is an ADDITIONAL name-based vhost. The existing :8080 block and whatever
# else you run on 80/443 keep working untouched.
#
# Install:
#   1. Point an A record at this VPS, e.g. voice.evisioninfoserve.com
#   2. Change server_name below to that name.
#   3. sudo cp deploy/nginx-evision-tls.conf /etc/nginx/sites-available/evision-tls.conf
#      sudo ln -s /etc/nginx/sites-available/evision-tls.conf /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d voice.evisioninfoserve.com
#
# Certbot rewrites this file: it adds the 443 listener with the certificate and
# turns this block into a redirect. Don't hand-edit its additions afterwards —
# re-run certbot instead.

server {
    listen 80;
    listen [::]:80;
    server_name voice.evisioninfoserve.com;   # <-- change me

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # book_meeting talks to Google twice while the caller is on the line;
        # the agent's own tool timeout is 25s, so stay comfortably above it.
        proxy_read_timeout 60s;
    }
}
